[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-summarizer"
version = "0.1.0"
description = "Serverless clinical text summarization API using AWS Lambda and Amazon Bedrock"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "aws-lambda-powertools>=2.35.0",
    "fastmcp>=0.1.0",
    "anthropic>=0.40.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "boto3-stubs[bedrock-runtime]>=1.34.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src/clinical_summarizer --cov=mcp_db_server --cov=mcp_summarizer_server --cov=api_server --cov-report=term-missing --cov-fail-under=90 -v"

[tool.coverage.run]
source = ["src/clinical_summarizer"]
omit = ["*/__init__.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
